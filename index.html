<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DojoApp">
<title>DojoApp</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1115;--card:#181b22;--card2:#11141a;--line:#2a2f3a;--txt:#e9ecf2;--mut:#8a93a6;--acc:#ff6b2c;--ok:#2ecc71;--warn:#ffb347;--blue:#3b82f6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:Inter,system-ui,sans-serif;color:var(--txt);padding:calc(14px + env(safe-area-inset-top)) 16px 120px;max-width:760px;margin:auto;-webkit-tap-highlight-color:transparent}
h1{font-size:24px;font-weight:900;letter-spacing:-.5px}h1 span{color:var(--acc)}
h2{font-size:19px}h3{font-size:18px}
.sub{color:var(--mut);font-size:13px}
.note{font-size:12.5px;color:var(--mut);line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--card);border:1px solid var(--line);color:var(--txt);padding:10px 14px;border-radius:999px;cursor:pointer;font:600 14px Inter;transition:.15s}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--acc);color:#fff;padding:13px 18px;border-radius:12px;text-decoration:none;font:700 15px Inter;border:0;cursor:pointer}
.btn.g{background:var(--line);color:var(--txt)}.btn.w{width:100%}.btn.sm{padding:8px 12px;font-size:13px}
.btn:disabled{opacity:.5}
input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font:15px Inter;margin:4px 0 12px}
label{font-size:12px;color:var(--mut);font-weight:600}
.tag{font-size:11px;background:#2a1a12;color:var(--acc);padding:4px 9px;border-radius:7px;font-weight:700}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--ok);transition:.4s}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.av{width:42px;height:42px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;font-weight:800;cursor:pointer;font-size:17px;flex-shrink:0}
.dayh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
/* pantallas */
.screen{position:fixed;inset:0;background:radial-gradient(circle at 50% -10%,#3a1b08,var(--bg) 55%);z-index:30;overflow:auto;padding:calc(24px + env(safe-area-inset-top)) 20px 30px;animation:fd .3s}
.screen.off{display:none}
.center{max-width:420px;margin:auto;text-align:center}
.logo{font-size:44px;font-weight:900;letter-spacing:-1.5px}.logo span{color:var(--acc)}
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:20px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 8px;text-align:center;cursor:pointer;color:var(--txt);font:inherit;transition:.15s}
.pc:active{transform:scale(.96)}
.pc .big{width:60px;height:60px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800}
.pc b{display:block;font-size:15px}.pc small{color:var(--mut);font-size:11.5px}
.pc.new{border-style:dashed}.pc.new .big{border:2px dashed var(--line);color:var(--mut)}
.dots{display:flex;gap:14px;justify-content:center;margin:24px 0}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--mut)}.dots i.f{background:var(--acc);border-color:var(--acc)}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px;justify-content:center}
.pad button{height:76px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--txt);font:600 26px Inter;cursor:pointer}
.pad button:active{background:var(--acc)}
.shake{animation:sh .4s}@keyframes sh{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.steps{display:flex;gap:6px;margin:6px 0 18px}.steps i{flex:1;height:5px;border-radius:5px;background:var(--line)}.steps i.f{background:var(--acc)}
.opt{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 14px}
.op{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 10px;text-align:left;color:var(--txt);font:inherit;cursor:pointer}
.op.on{border-color:var(--acc);background:#2a1608}.op b{display:block;font-size:14px}.op small{color:var(--mut);font-size:11.5px}
.op .e{font-size:22px;display:block;margin-bottom:4px}
/* app */
.view{display:none}.view.on{display:block;animation:fd .25s}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.hero{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,#2a1608,#181b22 65%);border-color:#3a2414}
.hero h2{font-size:21px;line-height:1.15;margin:2px 0}
.coach{display:flex;gap:12px;align-items:flex-start;background:linear-gradient(135deg,#132034,#181b22 70%);border-color:#22324d}
.coach .ic{font-size:26px}.coach p{font-size:14px;line-height:1.45}
.week{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px}
.wd{flex:1;min-width:44px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 0;text-align:center;cursor:pointer;color:var(--txt);font:inherit}
.wd small{display:block;font-size:11px;color:var(--mut)}.wd b{font-size:15px}
.wd.on{background:var(--acc);border-color:var(--acc)}.wd.on small{color:#fff}
.wd .st{width:6px;height:6px;border-radius:50%;margin:4px auto 0;background:transparent}
.wd .st.f{background:var(--ok)}.wd .st.p{background:var(--warn)}.wd .st.r{background:var(--line)}
.ex{padding:14px 0;border-top:1px solid var(--line)}.ex:first-of-type{border-top:0}
.exh{display:flex;gap:12px;align-items:center}
.thumb{width:54px;height:54px;border-radius:12px;background:#1a1f2b;flex-shrink:0;cursor:pointer;overflow:hidden}
.exn{font-weight:700;cursor:pointer;font-size:15px}
.exm{font-size:12px;color:var(--mut);margin-top:2px}
.rx{font-size:13px;margin-top:3px}.rx b{color:var(--acc)}
.sets{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.set{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--mut);cursor:pointer;font:700 14px Inter}
.set.done{background:var(--ok);border-color:var(--ok);color:#06210f}
.kg{width:78px;margin:0 0 0 auto;padding:10px;text-align:center;font-weight:700}
.sug{font-size:11.5px;color:var(--warn);margin-top:6px}
.nav{position:fixed;left:0;right:0;bottom:0;background:#12151bf0;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 0 calc(10px + env(safe-area-inset-bottom));z-index:8}
.nav button{background:none;border:0;color:var(--mut);font:600 11px Inter;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 12px;cursor:pointer}
.nav button span{font-size:22px;filter:grayscale(1);opacity:.55}
.nav button.on{color:var(--acc)}.nav button.on span{filter:none;opacity:1}
.restbar{position:fixed;left:12px;right:12px;bottom:calc(80px + env(safe-area-inset-bottom));max-width:736px;margin:auto;background:#1f2a22;border:1px solid var(--ok);border-radius:16px;padding:12px 14px;display:none;align-items:center;gap:10px;z-index:7;box-shadow:0 10px 30px #0008}
.restbar.on{display:flex;animation:fd .2s}.restbar.end{background:#3a1d0f;border-color:var(--acc)}
.restbar .tm{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;min-width:80px}
.restbar button{background:#ffffff14;border:0;color:var(--txt);border-radius:10px;padding:11px 12px;font:700 13px Inter;cursor:pointer}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:40}
.modal.open{display:flex}
.sheet{background:var(--card);border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-width:760px;width:100%;max-height:92vh;overflow:auto;animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.fig{background:#1a1f2b;border-radius:14px;margin:12px 0;display:flex;justify-content:center;padding:6px}
.sheet ol{padding-left:20px;font-size:14px;line-height:1.65}
.tip{background:#13261b;border-left:3px solid var(--ok);padding:9px 11px;border-radius:8px;font-size:13px;margin-top:10px}
.tip.w{background:#2a1a12;border-color:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{background:var(--card2);border-radius:12px;padding:12px 4px}.stats b{display:block;font-size:21px;color:var(--acc)}.stats span{font-size:11px;color:var(--mut)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;margin-top:8px}
.cal small{font-size:11px;color:var(--mut)}
.cd{aspect-ratio:1;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:12px;background:var(--card2);color:var(--mut)}
.cd.f{background:var(--ok);color:#06210f;font-weight:700}.cd.p{background:#4a3410;color:var(--warn);font-weight:700}.cd.t{outline:2px solid var(--acc)}
.lg{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:9px 0;border-top:1px solid var(--line)}
.meal{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line)}.meal:first-of-type{border-top:0}
.meal .e{font-size:24px}.meal b{font-size:13px;color:var(--acc)}.meal p{font-size:14px;line-height:1.4}
.macro{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-top:10px}
.macro div{background:var(--card2);border-radius:12px;padding:10px 4px}.macro b{display:block;font-size:18px}.macro span{font-size:11px;color:var(--mut)}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--card);border:1px solid var(--acc);color:var(--txt);padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;z-index:60;box-shadow:0 10px 30px #000a;max-width:90vw;text-align:center;animation:fd .25s}
.conf{position:fixed;top:-12px;width:9px;height:14px;z-index:59;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
.sync{font-size:11px;color:var(--mut);text-align:center;margin:10px 0}
table.adm{width:100%;border-collapse:collapse;font-size:12px}
table.adm th{color:var(--mut);text-align:left;font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}
table.adm td{padding:8px 4px;border-bottom:1px solid var(--line)}
.rest{text-align:center;padding:24px 10px;color:var(--mut)}
.link{background:none;border:0;color:var(--mut);font:600 13px Inter;cursor:pointer;text-decoration:underline;margin-top:22px}
</style>
</head>
<body>

<!-- ===== Selección de perfil ===== -->
<div class="screen" id="sPick"><div class="center">
 <div class="logo">Dojo<span>App</span></div>
 <p class="sub">Tu entrenador de bolsillo 🥋</p>
 <h2 style="margin-top:26px">¿Quién va a entrenar?</h2>
 <div class="pgrid" id="pgrid"><div class="note" style="grid-column:span 2">Cargando perfiles…</div></div>
 <button class="link" id="admLink">Panel de administrador</button>
</div></div>

<!-- ===== PIN ===== -->
<div class="screen off" id="sPin"><div class="center">
 <div class="av" id="pinAv" style="width:70px;height:70px;font-size:28px;margin:10px auto"></div>
 <h2 id="pinName"></h2><p class="sub">Escribe tu PIN de 4 dígitos</p>
 <div class="dots" id="pinDots"><i></i><i></i><i></i><i></i></div>
 <div class="pad" id="pinPad"></div>
 <label style="display:flex;gap:8px;justify-content:center;align-items:center;margin-top:18px"><input type="checkbox" id="remember" checked style="width:auto;margin:0"> Recordarme en este celular</label>
 <button class="link" id="pinBack">← Elegir otro perfil</button>
</div></div>

<!-- ===== Registro ===== -->
<div class="screen off" id="sReg"><div class="center" style="text-align:left" id="regBox"></div></div>

<!-- ===== App ===== -->
<div id="app" style="display:none">
 <div class="top"><div><h1>Dojo<span>App</span></h1><p class="sub" id="greet"></p></div><div class="av" id="av"></div></div>
 <section class="view on" id="v-hoy">
  <div class="card coach" id="coach"></div>
  <div class="card hero" id="hero"></div>
  <div class="week" id="week"></div>
  <div class="card" id="workout"></div>
 </section>
 <section class="view" id="v-prog"></section>
 <section class="view" id="v-comida"></section>
 <section class="view" id="v-perfil"></section>
 <div class="sync" id="sync"></div>
</div>

<div class="restbar" id="restbar"><div><div class="note">Descanso</div><div class="tm" id="rtm">0:00</div></div>
 <div style="flex:1"></div><button id="rm">−15</button><button id="rp">+15</button><button id="rs" style="background:var(--ok);color:#06210f">Listo</button></div>
<nav class="nav" id="nav" style="display:none">
 <button class="on" data-v="hoy"><span>🏋️</span>Hoy</button><button data-v="prog"><span>📈</span>Progreso</button>
 <button data-v="comida"><span>🥗</span>Comida</button><button data-v="perfil"><span>👤</span>Perfil</button></nav>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
// ================== CONFIG ==================
const API="https://script.google.com/macros/s/AKfycbyR5s26FWlzpriEHMLplwYMZCYFsADkn3jv4ugMWHdosmOCNarzGud8Um2TzBkmsjXo-g/exec";
const COLORS=["#ff6b2c","#3b82f6","#a855f7","#14b8a6","#eab308","#ec4899","#22c55e","#f43f5e"];
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// ================== EJERCICIOS ==================
const EX={
 press:{n:"Press de pecho con mancuernas",m:"Pecho · Tríceps · Hombro frontal",f:"press",
  s:["Acuéstate en banca (o en el piso) con una mancuerna en cada mano a la altura del pecho.","Codos a ~45° del cuerpo, no abiertos en cruz.","Empuja hacia arriba hasta casi estirar los brazos, juntando ligeramente las mancuernas.","Baja lento (2–3 seg) hasta sentir el estiramiento en el pecho."],
  t:"Aprieta los omóplatos contra la banca todo el tiempo."},
 inclinado:{n:"Press inclinado",m:"Pecho superior · Hombro",f:"press",
  s:["Banca a 30–45°. Mancuernas a la altura del pecho alto.","Empuja hacia arriba y ligeramente hacia adentro.","Baja controlado sin rebotar."],t:"El pecho superior es el que da 'volumen' visual. No subas la banca más de 45°."},
 aperturas:{n:"Aperturas (flyes)",m:"Pecho",f:"fly",
  s:["Acostado, brazos arriba con codos ligeramente doblados.","Abre los brazos en arco hasta sentir estiramiento en el pecho.","Regresa 'abrazando un barril' y aprieta el pecho arriba."],t:"Usa poco peso; el codo no se dobla más durante el movimiento."},
 lagartijas:{n:"Lagartijas sobre mancuernas",m:"Pecho · Tríceps · Core",f:"pushup",
  s:["Apoya las manos sobre las mancuernas (más rango de movimiento).","Cuerpo en línea recta, abdomen apretado.","Baja hasta que el pecho casi toque y empuja."],t:"Si cuesta mucho, hazlas con rodillas apoyadas."},
 remo:{n:"Remo a una mano",m:"Espalda (dorsal) · Bíceps",f:"row",
  s:["Apoya rodilla y mano del mismo lado en una banca o silla.","Espalda plana, mancuerna colgando.","Jala el codo hacia la cadera (no hacia el hombro).","Baja lento y estira completo."],t:"Piensa en 'meter el codo en el bolsillo trasero'."},
 remo2:{n:"Remo inclinado a dos manos",m:"Espalda media · Dorsal",f:"row",
  s:["De pie, rodillas un poco flexionadas, inclina el torso a ~45° con espalda recta.","Jala ambas mancuernas hacia el abdomen.","Aprieta los omóplatos arriba 1 seg y baja."],t:"No redondees la espalda baja."},
 pullover:{n:"Pullover",m:"Dorsal · Pecho · Serrato",f:"pullover",
  s:["Acostado, sostén una mancuerna con ambas manos sobre el pecho.","Bájala por detrás de la cabeza con codos ligeramente doblados.","Regresa al punto inicial usando espalda y pecho."],t:"Excelente para 'abrir' la espalda y el tórax."},
 posterior:{n:"Pájaros (deltoide posterior)",m:"Hombro posterior · Espalda alta",f:"fly",
  s:["Inclínate hacia el frente con espalda recta.","Con brazos casi estirados, abre hacia los lados hasta la altura de los hombros.","Baja lento."],t:"Mejora la postura y hace ver la espalda más ancha."},
 curl:{n:"Curl de bíceps",m:"Bíceps",f:"curl",
  s:["De pie, palmas al frente, codos pegados al cuerpo.","Sube las mancuernas sin mover los codos.","Aprieta arriba y baja en 3 seg."],t:"Sin balancear el cuerpo; si balanceas, el peso es mucho."},
 martillo:{n:"Curl martillo",m:"Bíceps · Braquial · Antebrazo",f:"curl",
  s:["Palmas mirándose entre sí (agarre neutro).","Sube alternando o ambas a la vez.","Baja controlado."],t:"El braquial empuja el bíceps hacia arriba: el brazo se ve más grueso."},
 concentrado:{n:"Curl concentrado",m:"Bíceps (pico)",f:"curl",
  s:["Sentado, apoya el codo en la parte interna del muslo.","Sube la mancuerna hacia el hombro.","Aprieta 1 seg arriba."],t:"Lento y controlado, poco peso."},
 frances:{n:"Extensión francesa sobre la cabeza",m:"Tríceps (cabeza larga)",f:"overhead",
  s:["Sentado o de pie, sostén una mancuerna con ambas manos sobre la cabeza.","Baja por detrás de la cabeza doblando solo los codos.","Estira los brazos arriba."],t:"El tríceps es ~2/3 del brazo: es clave para que el brazo crezca."},
 patada:{n:"Patada de tríceps",m:"Tríceps",f:"kick",
  s:["Inclinado, codo pegado al costado y doblado a 90°.","Estira el brazo hacia atrás hasta quedar recto.","Aprieta 1 seg y regresa."],t:"El codo no se mueve, solo el antebrazo."},
 hombro:{n:"Press de hombro sentado",m:"Hombros · Tríceps",f:"overhead",
  s:["Sentado con espalda apoyada, mancuernas a la altura de las orejas.","Empuja hacia arriba sin chocarlas.","Baja hasta la altura de la barbilla."],t:"Abdomen apretado para no arquear la espalda baja."},
 laterales:{n:"Elevaciones laterales",m:"Hombro lateral",f:"lateral",
  s:["De pie, mancuernas a los costados.","Sube los brazos a los lados hasta la altura del hombro, codo ligeramente flexionado.","Baja en 3 seg."],t:"Da la forma de 'V' al torso. Poco peso, mucha técnica."},
 goblet:{n:"Sentadilla goblet",m:"Cuádriceps · Glúteo · Core",f:"squat",
  s:["Sostén una mancuerna vertical frente al pecho.","Pies al ancho de hombros, baja como sentándote.","Rodillas en dirección de las puntas, pecho arriba.","Sube empujando con los talones."],t:"Quema muchas calorías: ayuda a bajar grasa abdominal."},
 rdl:{n:"Peso muerto rumano",m:"Femoral · Glúteo · Espalda baja",f:"rdl",
  s:["De pie, mancuernas frente a los muslos.","Lleva la cadera hacia atrás bajando las mancuernas pegadas a las piernas.","Espalda recta, rodillas apenas dobladas.","Sube apretando glúteos."],t:"Si sientes la espalda baja en lugar del femoral, reduce rango."},
 zancada:{n:"Zancadas (desplantes)",m:"Pierna completa · Glúteo",f:"lunge",
  s:["Mancuernas a los costados.","Da un paso al frente y baja hasta que ambas rodillas formen 90°.","Empuja para regresar. Alterna piernas."],t:"Las reps indicadas son por pierna."},
 pantorrilla:{n:"Elevación de talones",m:"Pantorrilla",f:"calf",
  s:["De pie con mancuernas, puntas sobre un escalón si se puede.","Sube en puntas lo más alto posible.","Baja lento."],t:"Pausa 1 seg arriba."},
 rusos:{n:"Giros rusos con mancuerna",m:"Oblicuos · Abdomen",f:"twist",
  s:["Sentado, rodillas dobladas, torso inclinado hacia atrás.","Sostén una mancuerna con ambas manos.","Gira el torso de lado a lado."],t:"Cada lado cuenta como 1 rep."},
 crunch:{n:"Crunch con mancuerna",m:"Recto abdominal",f:"crunch",
  s:["Acostado, rodillas dobladas, mancuerna sobre el pecho.","Despega los hombros del piso contrayendo el abdomen.","Baja lento sin soltar la tensión."],t:"No jales el cuello."},
 plancha:{n:"Plancha",m:"Core completo",f:"plank",
  s:["Apoya antebrazos y puntas de los pies.","Cuerpo recto de cabeza a talones.","Aprieta abdomen y glúteos y mantén."],t:"Indicado en segundos."},
 elevpiernas:{n:"Elevación de piernas",m:"Abdomen bajo",f:"legraise",

function list(v){return String(v||"").split(",").map(s=>s.trim()).filter(Boolean)}
function buildWeek(u){
 const tpl=T[u.lugar||"casa"][u.dias||5]||T.casa[5],ph=PHASES[u.fase||0],pi=+u.fase||0;
 const foc=list(u.enfoque),lim=list(u.limitaciones),reps=REPS[u.objetivo]||REPS.musculo;
 return tpl.map(day=>{
  if(!day)return {rest:1,t:"Descanso",x:[]};
  const seen=new Set();
  let x=day.x.map(r=>{
   let id=r[0];
   if(ph.swap&&SWAP[id])id=SWAP[id];
   if(lim.includes("lumbar")&&LUMBAR_SUB[id])id=LUMBAR_SUB[id];
   if(lim.includes("rodilla")&&KNEE_SUB[id])id=KNEE_SUB[id];
   if(lim.includes("hombro")&&SHOULDER_SUB[id])id=SHOULDER_SUB[id];
   let se=r[1],rp=r[2];
   if(!rp){rp=reps[pi]+(UNI.includes(id)?" c/l":"");se+=(ph.plus||0)+(foc.includes(GRP[id])?1:0);if(u.nivel==="principiante"&&pi===0)se=Math.max(2,se-1)}
   if(ph.half)se=Math.max(1,Math.ceil(se/2));
   return [id,se,rp];
  }).filter(r=>!seen.has(r[0])&&seen.add(r[0]));
  if(foc.includes("abdomen")&&!x.some(r=>GRP[r[0]]==="abdomen"))x.push(["plancha",3,"40s"]);
  return {...day,x};
 });
}

 // cuello y cabeza
 const nk=[J.sh[0]+(J.hd[0]-J.sh[0])*.5,J.sh[1]+(J.hd[1]-J.sh[1])*.5];
 o+=limb(J.sh,nk,7,SKIN);
 o+=`<circle cx="${J.hd[0]}" cy="${J.hd[1]}" r="12" fill="${SKIN}" stroke="${OUT}" stroke-width="3"/><path d="M${J.hd[0]-12} ${J.hd[1]-1} A12 12 0 0 1 ${J.hd[0]+11} ${J.hd[1]-5} Z" fill="#2b2118"/><circle cx="${J.hd[0]+5}" cy="${J.hd[1]+1}" r="1.7" fill="${OUT}"/>`;
 // brazo cercano: manga + antebrazo (con contorno para separarlo del cuerpo)
 const mid=[J.sh[0]+(J.el[0]-J.sh[0])*.45,J.sh[1]+(J.el[1]-J.sh[1])*.45];
 o+=limb(J.sh,J.el,10,hl("ua")?HL:SKIN,0)+ln(J.sh,mid,10,hl("ua")?HL:SHIRT)+limb(J.el,J.ha,8,hl("fa")?HL:SKIN);
 // músculo que se infla
 for(const s of ["ua","th"]){if(!hl(s))continue;const a=J[s==="ua"?"sh":"hp"],b=J[s==="ua"?"el":"kn"];
  const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,ang=Math.atan2(b[1]-a[1],b[0]-a[0])*180/Math.PI,L2=Math.hypot(b[0]-a[0],b[1]-a[1]);
  o+=`<ellipse cx="${mx}" cy="${my}" rx="${L2/2.8}" ry="${(s==="th"?7.5:6)+2.5*k}" transform="rotate(${ang} ${mx} ${my})" fill="${HL}" stroke="${OUT}" stroke-width="2" filter="url(#gl)"/>`}
 o+=`<circle cx="${J.ha[0]}" cy="${J.ha[1]}" r="4.5" fill="${SKIN}" stroke="${OUT}" stroke-width="2"/>`;
 const h=J.ha,f=J.ft;
 if(pr.includes("db"))o+=`<rect x="${h[0]-10}" y="${h[1]-2}" width="20" height="4" fill="#c9ced8" stroke="${OUT}" stroke-width="1"/><rect x="${h[0]-14}" y="${h[1]-7}" width="6" height="14" rx="2" fill="#6b7385" stroke="${OUT}" stroke-width="1.5"/><rect x="${h[0]+8}" y="${h[1]-7}" width="6" height="14" rx="2" fill="#6b7385" stroke="${OUT}" stroke-width="1.5"/>`;
 if(pr.includes("handle"))o+=`<rect x="${h[0]-3}" y="${h[1]-8}" width="6" height="16" rx="2" fill="#c9ced8" stroke="${OUT}" stroke-width="1.5"/>`;
 if(pr.includes("bar"))o+=`<rect x="${h[0]-24}" y="${h[1]-2.5}" width="48" height="5" rx="2" fill="#c9ced8" stroke="${OUT}" stroke-width="1.5"/>`;
 if(pr.includes("plate"))o+=`<line x1="${f[0]+6}" y1="${f[1]-22}" x2="${f[0]+6}" y2="${f[1]+22}" stroke="#c9ced8" stroke-width="6" stroke-linecap="round"/>`;
 if(pr.includes("pad"))o+=`<circle cx="${f[0]}" cy="${f[1]}" r="6" fill="#6b7385" stroke="${OUT}" stroke-width="1.5"/>`;

async function api(action,data={}){
 const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,...data})});
 const j=await r.json();if(!j.ok)throw new Error(j.error||"Error del servidor");return j;
}
function authed(){return {id:ME.user.id,pinHash:ME.pinHash}}
async function send(action,data,au){
 au=au||(ME&&authed());if(!au)return;
 try{await api(action,{...au,...data});setSync(true)}
 catch(e){
  if(/PIN/.test(e.message)){if(ME&&ME.user.id===au.id){toast("Sesión inválida, vuelve a entrar");logout()}return}
  QUEUE=QUEUE.filter(q=>!(q.action==="saveSession"&&action==="saveSession"&&q.data.session.fecha===data.session.fecha&&q.uid===au.id));
  QUEUE.push({action,data,uid:au.id,ph:au.pinHash});store.set("dojo_queue",QUEUE);setSync(false);
 }
}
async function flush(){
 if(!QUEUE.length)return;const q=[...QUEUE];QUEUE=[];store.set("dojo_queue",QUEUE);
 for(const it of q){try{await api(it.action,{id:it.uid,pinHash:it.ph,...it.data})}catch(e){if(!/PIN|desconocida/.test(e.message))QUEUE.push(it)}}
 store.set("dojo_queue",QUEUE);setSync(!QUEUE.length);
}

async function sha(s){
 try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
 catch(e){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return "x"+h}
}
const pinHashOf=(nombre,pin)=>sha("dojo|"+nombre.trim().toLowerCase()+"|"+pin);

}

function ses(f){return SES[f]||(SES[f]={fecha:f,detalle:{sets:{},kg:{}},hechas:0,total:0,pct:0})}
let saveT=null;
function persistDay(f,p){
 const s=ses(f);let ok=0,tot=0;p.x.forEach(r=>{tot+=r[1];ok+=(s.detalle.sets[r[0]]||[]).slice(0,r[1]).filter(Boolean).length});
 const prev=+s.pct||0;s.hechas=ok;s.total=tot;s.pct=tot?Math.round(ok/tot*100):0;s.rutina=p.t;s.diaSemana=DN[(new Date(f+"T12:00:00").getDay()+6)%7];
 s.detalle.ex=p.x.map(r=>({id:r[0],kg:s.detalle.kg[r[0]]||"",done:(s.detalle.sets[r[0]]||[]).filter(Boolean).length,total:r[1]}));
 if(!ok&&!Object.keys(s.detalle.kg).length){delete SES[f]}
 cacheMe();clearTimeout(saveT);
 const payload={session:{fecha:f,diaSemana:s.diaSemana,rutina:s.rutina,hechas:ok,total:tot,pct:s.pct,detalle:s.detalle}};
 if(prev<80&&s.pct>=80){send("saveSession",payload);celebrateDay(s)}else {const au=authed();saveT=setTimeout(()=>send("saveSession",payload,au),1500)}
}
function streak(){
 let n=0;const d=new Date();if(!(SES[iso(d)]&&+SES[iso(d)].pct>=80))d.setDate(d.getDate()-1);
 const w=WEEK;for(let i=0;i<400;i++){const f=iso(d),s=SES[f],di=(d.getDay()+6)%7;
  if(s&&+s.pct>=80)n++;else if(!(w[di]&&(w[di].rest||w[di].opt)))break;d.setDate(d.getDate()-1)}

function lastKg(id,before){

 for(const k of f){const e=(SES[k].detalle.ex||[]).find(x=>x.id===id&&x.kg);if(e)return {...e,fecha:k}}

// ================== COMIDA ==================
const FOOD={
 des:["Huevo a la mexicana (2–3 huevos) + 2 tortillas de maíz + fruta","Avena con leche, plátano y crema de cacahuate","Molletes integrales con frijol, poco queso y pico de gallo","Licuado: leche, plátano, avena y 1 cdita de crema de cacahuate","Omelette de claras y huevo con espinaca + pan integral","Yogurt griego con granola, fresas y nueces","Chilaquiles horneados con pollo y poca crema"],
 com:["Pechuga a la plancha + arroz + ensalada + frijoles","Tacos de bistec (3) en tortilla de maíz + nopales asados","Pescado empapelado con verduras + arroz integral","Caldo de pollo con verduras y tortillas","Bowl de carne molida magra con arroz, frijol, aguacate y pico","Atún con verduras en tostadas horneadas + fruta","Pollo en salsa verde + calabacitas + tortillas"],
 cen:["Quesadillas de maíz con queso panela y champiñones","Ensalada con pollo, aguacate y garbanzo","Sándwich integral de pechuga de pavo + verduras","Tostadas horneadas de tinga de pollo","Huevos revueltos con nopales + 1 tortilla","Sopa de verduras + queso panela asado","Yogurt griego + fruta + almendras (cena ligera)"],
 snk:["Fruta + puñito de almendras","Yogurt griego natural","Jícama, pepino y zanahoria con limón y chile","Atún en lata con galletas integrales","2 huevos cocidos","Licuado de proteína o de leche con fruta","Queso panela con pepino"]
};
function nutrition(){
 const u=ME.user,w=+u.peso||70,h=(+u.estatura||1.7)*100,a=+u.edad||30;
 const bmr=10*w+6.25*h-5*a+(u.sexo==="m"?-161:5),act=1.3+(+u.dias||4)*.05,tdee=bmr*act;
 const adj={musculo:+300,grasa:-450,tono:-200,salud:0}[u.objetivo]||0;
 const kcal=Math.round((tdee+adj)/50)*50,prot=Math.round(w*({grasa:2,musculo:1.8,tono:1.8,salud:1.4}[u.objetivo]||1.6)),agua=(w*.035+.5).toFixed(1);
 return {kcal,prot,agua,fat:Math.round(kcal*.27/9),carb:Math.round((kcal-prot*4-kcal*.27)/4)};
}
function renderFood(){
 const u=ME.user,n=nutrition(),di=Math.floor(new Date()/864e5),pick=k=>FOOD[k][di%7],pick2=k=>FOOD[k][(di+3)%7];
 const tip={musculo:"Come cada 3–4 horas y no te saltes el desayuno. Si no subes de peso en 2 semanas, agrega un licuado extra.",grasa:"Llena medio plato de verduras, evita refrescos y jugos, y deja las harinas blancas para el desayuno o después de entrenar.",tono:"Prioriza la proteína en cada comida y cuida los antojos de la noche.",salud:"Come variado, muchas verduras y agua natural. La constancia vale más que la perfección."}[u.objetivo];
 $("v-comida").innerHTML=`<div class="card"><div class="dayh"><h2>🥗 Tu plan de hoy</h2><span class="tag">${OBJ[u.objetivo][0]} ${OBJ[u.objetivo][1]}</span></div>
 <div class="macro"><div><b style="color:var(--acc)">${n.kcal}</b><span>kcal / día</span></div><div><b style="color:var(--blue)">${n.prot} g</b><span>proteína</span></div><div><b style="color:#14b8a6">${n.agua} L</b><span>agua</span></div></div>
 <p class="note" style="margin-top:10px">Aprox. ${n.carb} g de carbohidratos y ${n.fat} g de grasa. Proteína ≈ ${Math.round(n.prot/4)} g por comida.</p></div>
 <div class="card"><h2>🍽️ Menú sugerido</h2>
 ${[["🌅","Desayuno",pick("des")],["🍎","Colación",pick("snk")],["🍛","Comida",pick("com")],["🥜","Colación",pick2("snk")],["🌙","Cena",pick("cen")]].map(m=>`<div class="meal"><div class="e">${m[0]}</div><div><b>${m[1]}</b><p>${m[2]}</p></div></div>`).join("")}
 <p class="note" style="margin-top:8px">El menú cambia cada día. Las porciones: proteína del tamaño de tu palma, carbohidratos de tu puño, verduras sin límite.</p></div>
 <div class="card"><h2>💡 Consejo del Dojo</h2><p style="font-size:14px;line-height:1.5;margin-top:6px">${tip}</p>
 <div class="tip" style="margin-top:12px">🏋️ Después de entrenar: proteína + carbohidrato en las siguientes 2 horas (ej. pollo con arroz o licuado con plátano).</div></div>
 <p class="note" style="text-align:center;margin:8px 10px">Recomendaciones generales calculadas con tu peso, estatura, edad y objetivo. No sustituyen a un nutriólogo, sobre todo si tienes alguna condición médica.</p>`;
}

// ================== PERFIL ==================
function renderPerfil(){
 const u=ME.user,imc=(+u.peso/(+u.estatura*+u.estatura)).toFixed(1),np=("Notification" in window)?Notification.permission:"no";
 $("v-perfil").innerHTML=`<div class="card" style="display:flex;gap:14px;align-items:center"><div class="av" style="width:64px;height:64px;font-size:26px;background:${u.color||COLORS[0]}">${esc(String(u.nombre)[0]).toUpperCase()}</div>
  <div><h2>${esc(u.nombre)}</h2><p class="note">${u.edad} años · ${u.estatura} m · ${u.peso} kg · IMC ${imc}</p><p class="note">Miembro desde ${String(u.creado||"").slice(0,10)}</p></div></div>
 <div class="card"><h2>⚙️ Mi plan</h2><p class="note" style="margin-bottom:10px">Si cambias algo, tu rutina se ajusta al momento.</p>
  <label>Objetivo</label><select id="pObj">${Object.entries(OBJ).map(([k,v])=>`<option value="${k}" ${u.objetivo===k?"selected":""}>${v[0]} ${v[1]}</option>`).join("")}</select>
  <div class="row" style="flex-wrap:nowrap"><div style="flex:1"><label>Lugar</label><select id="pLug"><option value="casa" ${u.lugar==="casa"?"selected":""}>🏠 Casa</option><option value="gym" ${u.lugar==="gym"?"selected":""}>🏢 Gimnasio</option></select></div>
  <div style="flex:1"><label>Días/semana</label><select id="pDias">${[3,4,5].map(d=>`<option ${+u.dias===d?"selected":""}>${d}</option>`).join("")}</select></div></div>
  <label>Zonas de enfoque</label><div class="row" id="pFoc">${FOCUS.map(([v,l])=>`<button class="chip ${list(u.enfoque).includes(v)?"on":""}" data-v="${v}">${l}</button>`).join("")}</div><div style="height:12px"></div>
  <label>Cuidar</label><div class="row" id="pLim">${LIM.map(([v,l])=>`<button class="chip ${list(u.limitaciones).includes(v)?"on":""}" data-v="${v}">${l}</button>`).join("")}</div>
  <button class="btn w" id="pSave" style="margin-top:16px">Guardar cambios</button></div>
 <div class="card"><h2>🔔 Notificaciones</h2>
  <label style="margin-top:8px;display:block">Correo para avisos</label><input id="pMail" type="email" value="${esc(u.email||"")}" placeholder="tucorreo@gmail.com">
  <button class="btn g w" id="pNot">${np==="granted"?"✅ Avisos en este celular activados":"Activar avisos en este celular"}</button>
  <p class="note" style="margin-top:8px">Por correo: felicitación al cumplir tu día y recordatorio a las 7 pm si te falta.</p></div>
 <div class="card"><h2>🔐 Seguridad</h2><label style="margin-top:8px;display:block">Nuevo PIN (4 dígitos)</label><input id="pPin" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
  <button class="btn g w" id="pPinB">Cambiar PIN</button></div>
 <div class="card note"><b style="color:var(--txt)">Reglas del Dojo</b><br>• Calienta 5 min antes de empezar.<br>• Elige un peso con el que las últimas 2 reps cuesten trabajo, con buena técnica.<br>• Anota los kg: la app te dirá cuándo subir.<br>• Si hay dolor en articulaciones (no muscular), detente.<br>• Duerme 7–8 h y toma agua.</div>
 <button class="btn g w" id="pOut">🚪 Cerrar sesión / cambiar de perfil</button>`;
 const tog=id=>$(id).querySelectorAll(".chip").forEach(b=>b.onclick=()=>b.classList.toggle("on"));tog("pFoc");tog("pLim");
 const sel=id=>[...$(id).querySelectorAll(".chip.on")].map(b=>b.dataset.v).join(",");
 $("pSave").onclick=()=>{const f={objetivo:$("pObj").value,lugar:$("pLug").value,dias:+$("pDias").value,enfoque:sel("pFoc"),limitaciones:sel("pLim"),email:$("pMail").value.trim()};
  Object.assign(ME.user,f);cacheMe();send("updateUser",{fields:f});render();toast("✅ Plan actualizado");goView("hoy")};
 $("pNot").onclick=async()=>{await askNotif();renderPerfil();if(Notification.permission==="granted")notify("DojoApp","¡Listo! Así te avisaremos 💪")};
 $("pPinB").onclick=async()=>{const v=$("pPin").value;if(!/^\d{4}$/.test(v))return toast("El PIN debe ser de 4 números");
  const h=await pinHashOf(u.nombre,v);try{await api("updateUser",{...authed(),fields:{newPinHash:h}});ME.pinHash=h;store.set("dojo_auth_"+u.id,h);cacheMe();toast("🔐 PIN actualizado")}catch(e){toast("No se pudo: "+esc(e.message))}};
 $("pOut").onclick=logout;
}

// ================== ADMIN ==================
$("admLink").onclick=()=>{
 openSheet(`<h3>🛡️ Panel de administrador</h3><p class="note" style="margin:6px 0 12px">Escribe la clave de administrador.</p>
 <input id="aKey" type="password" placeholder="Clave"><button class="btn w" id="aGo">Entrar</button>`);
 $("aKey").value=sessionStorage.getItem("dojo_admin")||"";
 $("aGo").onclick=async()=>{try{const j=await api("admin",{key:$("aKey").value});try{sessionStorage.setItem("dojo_admin",$("aKey").value)}catch(e){}adminView(j.users)}catch(e){toast(esc(e.message))}};
};
function adminView(us){
 const act=us.filter(u=>u.ultimaSesion&&(new Date()-new Date(u.ultimaSesion+"T12:00:00"))/864e5<=7).length;
 openSheet(`<div class="dayh"><h3>🛡️ Dojo · ${us.length} miembros</h3><button class="btn g sm" onclick="closeSheet()">Cerrar</button></div>
 <div class="stats" style="margin:10px 0"><div><b>${us.length}</b><span>Registrados</span></div><div><b>${act}</b><span>Activos 7 días</span></div><div><b>${us.reduce((a,u)=>a+u.cumplidos,0)}</b><span>Días cumplidos</span></div></div>
 <div style="overflow-x:auto"><table class="adm"><tr><th>Miembro</th><th>Objetivo</th><th>Fase</th><th>Cumplidos</th><th>Última</th><th>Peso</th></tr>
 ${us.sort((a,b)=>b.cumplidos-a.cumplidos).map(u=>`<tr><td><b>${esc(u.nombre)}</b><br><span class="note">${u.lugar==="gym"?"Gym":"Casa"} · ${u.dias}d · ${u.edad}a</span></td><td>${(OBJ[u.objetivo]||["",""])[0]} ${(OBJ[u.objetivo]||["",u.objetivo])[1]}</td>
 <td>${PHASES[+u.fase||0].ic} ${PHASES[+u.fase||0].n}<br><span class="note">ciclo ${u.ciclo||1}</span></td><td><b style="color:var(--ok)">${u.cumplidos}</b><span class="note">/${u.sesiones}</span></td>
 <td>${u.ultimaSesion?new Date(u.ultimaSesion+"T12:00:00").toLocaleDateString("es-MX",{day:"numeric",month:"short"}):"—"}</td><td>${u.pesoInicial}→<b>${u.pesoActual}</b></td></tr>`).join("")}</table></div>
 <p class="note" style="margin-top:10px">Todo el detalle (sesiones, pesos por ejercicio y medidas) está en tu Google Sheets.</p>`);
}

// ================== INICIO ==================
loadPicker();
if("serviceWorker" in navigator&&location.protocol==="https:"){try{navigator.serviceWorker.register("sw.js")}catch(e){}}
</script>
</body>
</html>
